# detekt 静态分析配置
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 600

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    # 与根 .editorconfig 的 max_line_length 对齐。detekt 默认 120 会把 121–140 字符
    # 的行记成另一套债务；项目明确采用 140 后，>140 的行仍由该规则真实拦截。
    maxLineLength: 140
  UnusedImports:
    active: true
  TrailingWhitespace:
    active: true

potential-bugs:
  UnreachableCode:
    active: true

performance:
  CouldBeSequence:
    active: true

naming:
  active: true

exceptions:
  active: true

empty-blocks:
  active: true
